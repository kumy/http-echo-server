version: "2"

linters:
  default: standard
  enable:
    - gosec
    - misspell
    - revive
    - unconvert
    - unparam
    - copyloopvar
    - nilerr
    - prealloc
  settings:
    revive:
      rules:
        - name: exported
          disabled: false
  exclusions:
    rules:
      # Tests may use weaker patterns (hardcoded creds, unchecked errors in helpers)
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/kumy/https-echo-server
