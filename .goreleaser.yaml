version: 2

project_name: http-echo-server

before:
  hooks:
    - go mod tidy

builds:
  - id: http-echo-server
    main: ./cmd/http-echo-server
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/kumy/http-echo-server/internal/version.Version={{ .Version }}
      - -X github.com/kumy/http-echo-server/internal/version.Commit={{ .ShortCommit }}
      - -X github.com/kumy/http-echo-server/internal/version.Date={{ .Date }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  # Release notes are generated by semantic-release; goreleaser only attaches
  # artifacts to the existing release.
  disable: true

release:
  mode: keep-existing

dockers:
  - id: amd64
    use: buildx
    goos: linux
    goarch: amd64
    dockerfile: Dockerfile.goreleaser
    image_templates:
      - ghcr.io/kumy/http-echo-server:{{ .Version }}-amd64
    build_flag_templates:
      - --platform=linux/amd64
      - --label=org.opencontainers.image.version={{ .Version }}
      - --label=org.opencontainers.image.revision={{ .FullCommit }}
      - --label=org.opencontainers.image.created={{ .Date }}
  - id: arm64
    use: buildx
    goos: linux
    goarch: arm64
    dockerfile: Dockerfile.goreleaser
    image_templates:
      - ghcr.io/kumy/http-echo-server:{{ .Version }}-arm64
    build_flag_templates:
      - --platform=linux/arm64
      - --label=org.opencontainers.image.version={{ .Version }}
      - --label=org.opencontainers.image.revision={{ .FullCommit }}
      - --label=org.opencontainers.image.created={{ .Date }}

docker_manifests:
  - name_template: ghcr.io/kumy/http-echo-server:{{ .Version }}
    image_templates:
      - ghcr.io/kumy/http-echo-server:{{ .Version }}-amd64
      - ghcr.io/kumy/http-echo-server:{{ .Version }}-arm64
  - name_template: ghcr.io/kumy/http-echo-server:{{ .Major }}.{{ .Minor }}
    image_templates:
      - ghcr.io/kumy/http-echo-server:{{ .Version }}-amd64
      - ghcr.io/kumy/http-echo-server:{{ .Version }}-arm64
  - name_template: ghcr.io/kumy/http-echo-server:{{ .Major }}
    image_templates:
      - ghcr.io/kumy/http-echo-server:{{ .Version }}-amd64
      - ghcr.io/kumy/http-echo-server:{{ .Version }}-arm64
  - name_template: ghcr.io/kumy/http-echo-server:latest
    image_templates:
      - ghcr.io/kumy/http-echo-server:{{ .Version }}-amd64
      - ghcr.io/kumy/http-echo-server:{{ .Version }}-arm64
